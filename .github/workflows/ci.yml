name: Diary API Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up environment
        run: |
          cat > .env <<'EOF'
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=luaaidiary
          POSTGRES_USER=luaaidiary
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          DB_POOL_SIZE=100
          DB_POOL_TIMEOUT=60000
          DB_CONNECT_TIMEOUT=3000
          DB_READ_TIMEOUT=10000
          DB_SEND_TIMEOUT=10000
          REDIS_HOST=redis
          REDIS_PORT=6379
          LAPIS_ENVIRONMENT=development
          ENCRYPTION_KEY=00000000000000000000000000000000
          EOF

      - name: Start services
        run: docker compose up -d --build

      - name: Wait for services
        run: |
          for i in {1..30}; do
            if curl -sSf http://localhost:8080/health > /dev/null; then
              break
            fi
            sleep 2
          done
          curl -sSf http://localhost:8080/health
          curl -sSf http://localhost:8080/api/db-test
          curl -sSf http://localhost:8080/api/redis-test

      - name: Prepare test user
        run: |
          docker compose exec -T db psql -U luaaidiary -d luaaidiary -c "DELETE FROM users WHERE username = 'e2e_ci_user';"

      - name: Run E2E tests
        env:
          BASE_URL: http://localhost:8080
          ADMIN_USER: admin
          ADMIN_PASS: admin123
        run: |
          TEST_USERNAME=e2e_ci_user TEST_EMAIL=e2e_ci_user@test.com TEST_PASSWORD=TestPass123! bash tests/e2e/test_post_api.sh

      - name: Cleanup
        if: always()
        run: docker compose down -v
