name: Release and Deploy

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing vX.Y.Z release to deploy (also re-resolves desired infrastructure tags)'
        required: true
        type: string
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  packages: write

concurrency:
  group: luaaidiary-production-deploy
  cancel-in-progress: false

jobs:
  build_and_push:
    if: >-
      github.event.pull_request.merged == true &&
      !contains(join(github.event.pull_request.labels.*.name, ','), 'no_build')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Calculate next version from PR labels
        id: version
        shell: bash
        run: |
          set -euo pipefail

          labels="${{ join(github.event.pull_request.labels.*.name, ' ') }}"
          echo "PR labels: $labels"

          if echo " $labels " | grep -qi " bump_major "; then
            bump="major"
          elif echo " $labels " | grep -qi " bump_minor "; then
            bump="minor"
          elif echo " $labels " | grep -qi " bump_patch "; then
            bump="patch"
          else
            echo "Missing required bump_major, bump_minor or bump_patch label" >&2
            exit 1
          fi
          echo "Selected bump type: $bump"

          latest_tag="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"

          if [ -z "$latest_tag" ]; then
            echo "Missing existing semver release tag" >&2
            exit 1
          fi

          core="${latest_tag#v}"
          IFS='.' read -r major minor patch <<< "$core"

          case "$bump" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac

          next_tag="v${major}.${minor}.${patch}"
          echo "Latest tag: $latest_tag"
          echo "Calculated next tag: $next_tag"

          echo "version=$next_tag" >> "$GITHUB_OUTPUT"
          echo "app_version=${next_tag#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push git tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app_version }}
          push: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/hawkie275/luaaidiary:${{ steps.version.outputs.version }}
            ghcr.io/hawkie275/luaaidiary:latest

  deploy_web:
    needs: build_and_push
    runs-on: self-hosted
    environment: production
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_WEB_IMAGE: ghcr.io/hawkie275/luaaidiary:${{ needs.build_and_push.outputs.version }}
      COMPOSE_PROJECT_NAME: luaaidiary
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy matching materials and update all services
        shell: bash
        run: bash scripts/deploy-release.sh

  manual_infra_update:
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    environment: production
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_WEB_IMAGE: ghcr.io/hawkie275/luaaidiary:${{ inputs.release_tag }}
      DEPLOY_RELEASE_REF: refs/tags/${{ inputs.release_tag }}
      COMPOSE_PROJECT_NAME: luaaidiary
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Re-resolve desired infrastructure and deploy
        shell: bash
        run: bash scripts/deploy-release.sh
