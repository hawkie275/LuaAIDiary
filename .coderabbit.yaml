language: "ja"

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "staging"

chat:
  auto_reply: true

reviews:
  path_instructions:
    - path: "docs/**"
      instructions: Document ファイルのためレビューは不要です。

    - path: "tests/**"
      instructions: Test ファイルのためレビューは不要です。
