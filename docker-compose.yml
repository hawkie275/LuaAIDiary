x-infra:
  postgres: ${POSTGRES_DESIRED_VERSION:-19}
  valkey: ${VALKEY_DESIRED_VERSION:-latest}

services:
  web:
    image: ${WEB_IMAGE:-ghcr.io/hawkie275/luaaidiary:latest}
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - logs:/var/log/nginx
      - media_uploads:/app/uploads
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=valkey
      - REDIS_PORT=6379
      - LAPIS_ENVIRONMENT=development
    depends_on:
      - db
      - valkey
    networks:
      - luaaidiary-network
    restart: unless-stopped

  db:
    image: ${PG_IMAGE:?Use make infra-update or make setup; runtime must be pinned}
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - PGDATA=${PG_DATA:?Runtime PGDATA is required}
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - luaaidiary-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: ${VALKEY_IMAGE:?Use make infra-update or make setup; runtime must be pinned}
    volumes:
      - redis_data:/data
    networks:
      - luaaidiary-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  luaaidiary-network:
    driver: bridge

volumes:
  db_data:
    external: true
    name: ${PG_VOLUME:?Managed database volume is required}
  redis_data:
    external: true
    name: ${VALKEY_VOLUME:?Managed Valkey volume is required}
  logs:
    driver: local
  media_uploads:
    driver: local
