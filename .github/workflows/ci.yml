name: Diary API Tests

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Disposable CI only: do not use these settings for managed deployments.
    env:
      COMPOSE_PROJECT_NAME: luaaidiary-ci
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
      PG_IMAGE: postgres:19
      VALKEY_IMAGE: valkey/valkey:latest
      WEB_IMAGE: luaaidiary-web:ci
      PG_DATA: /var/lib/postgresql/managed
      PG_VOLUME: luaaidiary-ci-db
      VALKEY_VOLUME: luaaidiary-ci-valkey
    steps:
      - uses: actions/checkout@v4

      - name: Set up environment
        run: |
          cat > .env <<'EOF'
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=luaaidiary
          POSTGRES_USER=luaaidiary
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          DB_POOL_SIZE=100
          DB_POOL_TIMEOUT=60000
          DB_CONNECT_TIMEOUT=3000
          DB_READ_TIMEOUT=10000
          DB_SEND_TIMEOUT=10000
          REDIS_HOST=redis
          REDIS_PORT=6379
          LAPIS_ENVIRONMENT=development
          ENCRYPTION_KEY=00000000000000000000000000000000
          EOF
          cat > docker-compose.ci.yml <<'EOF'
          services:
            db:
              volumes:
                - ./postgresql/init:/docker-entrypoint-initdb.d:ro
              healthcheck:
                # The init server only listens on a Unix socket; require the final TCP server.
                test: ["CMD-SHELL", "PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -v ON_ERROR_STOP=1 -c 'SELECT 1' > /dev/null"]
          volumes:
            db_data:
              external: false
            redis_data:
              external: false
          EOF

      - name: Start services
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Wait for services
        run: |
          for i in {1..30}; do
            if curl -sSf http://localhost:8080/health > /dev/null; then
              break
            fi
            sleep 2
          done
          curl -sSf http://localhost:8080/health
          curl -sSf http://localhost:8080/api/db-test | jq -e '.status == "success"'
          curl -sSf http://localhost:8080/api/redis-test

      - name: Prepare test user
        run: |
          docker compose exec -T db psql -U luaaidiary -d luaaidiary -c "DELETE FROM users WHERE username = 'e2e_ci_user';"

      - name: Run E2E tests
        env:
          BASE_URL: http://localhost:8080
          ADMIN_USER: admin
          ADMIN_PASS: admin123
        run: |
          TEST_USERNAME=e2e_ci_user TEST_EMAIL=e2e_ci_user@test.com TEST_PASSWORD=TestPass123! bash tests/e2e/test_post_api.sh

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Cleanup
        if: always()
        run: docker compose down -v
